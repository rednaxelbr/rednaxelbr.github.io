type: object
description: Descoberta pendente para o usuário do token
properties:
  id:
    type: integer
    description: ID da descoberta (use no PUT/DELETE de /userdiscoveries/{id} para marcar como lida)
  tela:
    type: string
  titulo:
    type: string
  texto:
    type: string
  link_artigo:
    type: string
    description: Link opcional para o artigo da base de conhecimento ("Saiba mais")
  ordem:
    type: integer
  data_hora:
    type: string
    description: Data/hora da leitura (vazio quando pendente)
